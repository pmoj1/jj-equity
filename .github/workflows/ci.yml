name: J&J Equity checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:desktop
      - name: Check workspace and valuation logic
        working-directory: app/web
        run: ../node_modules/.bin/vitest run lib/workspace.test.ts lib/portfolio.test.ts lib/status.test.ts
      - run: npm run typecheck
      - run: npm run build
